name: FirstPlugin  # Le nom du plugin
version: 1.0
api-version: 1.20 # version de Spigot pour laquelle le plugin est fait
main: me.nooeee.FirstPlugin.Main
commands:
  spawn:
    description: Permet au joueur de se téléporter au spawn.
    permission: myplugins.command.use
    permission-message: "§cVous n'avez pas la permission d'utiliser cette commande." # Ne marche pas : command not found
    aliases: lobby
  god:
    description: Rend le joueur invulnérable
    usage: /<command> #<player>
    permission: myplugins.command.godmode
    permission-message: "§cVous n'avez pas la permission d'utiliser cette commande."
    aliases:
    - invincible
    - gm
